name: Bug report
description: Something in the MCP server, tools, or slash commands doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste your ECFS API key** into an issue. If one ends
        up in a log, replace it with `REDACTED`. Security problems go through
        [private reporting](https://github.com/Reid-n0rc/fcc-ecfs-mcp/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool or command
      options:
        - ecfs_search_filings
        - ecfs_get_filing
        - ecfs_search_documents
        - ecfs_search_proceedings
        - ecfs_get_download_plan
        - ecfs_list_inboxes
        - ecfs_raw_request
        - A slash command (/fcc-...)
        - Installation or startup
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or prompt to reproduce
      description: The prompt you gave Claude, or the tool input (docket number, submission ID, filters).
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      description: Paste the relevant output. Check it for your API key first.
      render: text
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `.claude-plugin/plugin.json` or `package.json`, e.g. 0.3.0.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version (`node --version`), and Claude Code version.
      placeholder: macOS 26, Node 22.12, Claude Code 2.x
