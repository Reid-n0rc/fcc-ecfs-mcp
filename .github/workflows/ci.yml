name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC — catches ECFS API drift
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # Docs-only changes skip the test jobs. Done here rather than with `paths-ignore` so
    # the required `ci-ok` check still reports (and passes) on docs-only PRs.
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          # Docs and GitHub community files (issue/PR templates, CODEOWNERS) that no test exercises.
          DOCS: '(\.md$|^LICENSE$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/CODEOWNERS$)'
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;; # schedule / manual dispatch: always test
          esac
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            code=true
          elif git diff --name-only "$base" HEAD | grep -qvE "$DOCS"; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24] # vitest requires Node >=22.12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Coverage on one leg only, so each commit gets a single Codecov upload.
      - run: npm test
        if: matrix.node != 22
      # JUnit for Codecov Test Analytics. Passing --reporter replaces vitest's defaults,
      # so default + github-actions are listed explicitly to keep console output and annotations.
      - run: >-
          npm run test:coverage --
          --reporter=default --reporter=github-actions --reporter=junit
          --outputFile.junit=test-results/junit.xml
        if: matrix.node == 22
      - uses: codecov/codecov-action@v7
        # Fork PRs get no secret; Codecov accepts tokenless uploads for public repos.
        # fail_ci_if_error: false keeps a Codecov outage from failing `test` and `ci-ok`.
        if: matrix.node == 22 && !cancelled()
        with:
          files: ./coverage/lcov.info
          disable_search: true
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v7
        # Test Analytics. !cancelled() so failing tests still upload their results;
        # fail_ci_if_error: false keeps a Codecov outage from failing `test` and `ci-ok`.
        if: matrix.node == 22 && !cancelled()
        with:
          report_type: test_results
          files: ./test-results/junit.xml
          disable_search: true
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: npm run build
      # Checks the tarball holds exactly npm's always-included files plus every tracked file
      # under dist/, so the `files` allowlist can't drift and stray build output can't ship.
      # Then runs the packed bin directly (no `node` in front), the way npx and MCP clients do.
      # Needs no API key: `initialize` never calls ECFS. One leg is enough; timeout is a backstop.
      - name: Pack, check contents, install and smoke-test the bin
        if: matrix.node == 22
        run: |
          tmp="$RUNNER_TEMP/pack-smoke"
          mkdir -p "$tmp"
          npm pack --json --pack-destination "$tmp" > "$tmp/pack.json"
          tarball="$tmp/$(jq -r '.[0].filename' "$tmp/pack.json")"
          jq -r '.[0].files[].path' "$tmp/pack.json" | LC_ALL=C sort > "$tmp/actual.txt"
          { printf '%s\n' LICENSE README.md package.json; git ls-files dist; } | LC_ALL=C sort > "$tmp/expected.txt"
          diff -u "$tmp/expected.txt" "$tmp/actual.txt"
          npm install --prefix "$tmp/app" --no-audit --no-fund "$tarball"
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          out="$(printf '%s\n' "$init" | timeout 15 "$tmp/app/node_modules/.bin/fcc-ecfs-mcp")" || true
          echo "$out"
          grep -q '"serverInfo":{"name":"fcc-ecfs-mcp"' <<<"$out"

  live:
    # Secrets aren't available to fork PRs, so those skip the live job. Same-repo PRs
    # (including Dependabot, which reads its own Dependabot-scoped ECFS_API_KEY) run it.
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      # Per-ref so parallel PRs don't cancel each other's pending live runs.
      group: ecfs-live-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          ECFS_API_KEY: ${{ secrets.ECFS_API_KEY }}

  ci-ok:
    # The single required status check. Passes when every job succeeded or was
    # intentionally skipped; fails on any failure or cancellation.
    if: always()
    needs: [changes, test, live]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
